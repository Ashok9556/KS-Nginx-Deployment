apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: nginx-eks-cluster
  region: us-east-1
  version: "1.33"

managedNodeGroups:
  - name: nginx-worker-nodes
    instanceType: t3.medium
    desiredCapacity: 2
    minSize: 1
    maxSize: 3
    volumeSize: 20
    ssh:
      allow: false
    labels:
      role: worker
    tags:
      environment: demo
